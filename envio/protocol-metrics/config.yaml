# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: protocol-metrics
contracts:
  - name: StakeManager
    abi_file_path: abis/0x2c9c959516e9aaedb2c748224a41249202ca8be7.abi.json
    handler: src/EventHandlers.ts
    events:
      - event: Initialized
      - event: Deposit
        field_selection:
          transaction_fields:
            - hash
            - from
            - gasUsed
            - effectiveGasPrice
            - gasPrice
            - status
      - event: Withdraw
        field_selection:
          transaction_fields:
            - hash
            - from
            - gasUsed
            - effectiveGasPrice
            - gasPrice
            - status
  - name: AmbientCore
    abi_file_path: abis/ambient-core.json
    handler: src/EventHandlers_Ambient.ts
    events:
      - event: CrocSwap
        field_selection:
          transaction_fields:
            - hash
            - from
            - gasUsed
            - effectiveGasPrice
            - gasPrice
            - status
      - event: CrocMicroSwap
        field_selection:
          transaction_fields:
            - hash
            - from
            - gasUsed
            - effectiveGasPrice
            - gasPrice
            - status
  - name: Curvance
    abi_file_path: abis/curvance.json
    handler: src/EventHandlers_Curvance.ts
    events:
      - event: Pump
        field_selection:
          transaction_fields:
            - hash
            - from
            - gasUsed
            - effectiveGasPrice
            - gasPrice
            - status
  # Wildcard indexing for all ERC20 transfers (for momentum/volatility calculation)
  - name: ERC20
    handler: src/EventHandlers_ERC20.ts
    events:
      - event: Transfer(address indexed from, address indexed to, uint256 value)
        field_selection:
          transaction_fields:
            - hash
            - from
            - to
            - value  # Include transaction value for native MON tracking
            - gasUsed
            - effectiveGasPrice
  # Universal Router swaps for DEX metrics
  - name: UniversalRouter
    abi_file_path: abis/universal-router.json
    handler: src/EventHandlers_Swaps.ts
    events:
      - event: SwapExecuted(address indexed tokenIn, address indexed tokenOut, uint256 amountIn, uint256 amountOut, address indexed recipient)
        field_selection:
          transaction_fields:
            - hash
            - from
            - value  # Include native value for MON/WMON correlation
  # Kuru Orderbook for CLOB trading metrics
  - name: KuruOrderbook
    abi_file_path: abis/kuru-orderbook.json
    handler: src/EventHandlers_Kuru.ts
    events:
      - event: Trade
        field_selection:
          transaction_fields:
            - hash
            - from
            - gasUsed
            - effectiveGasPrice
            - status
networks:
- id: 10143
  start_block: 0
  rpc: https://testnet-rpc.monad.xyz
  contracts:
    - name: StakeManager
      address:
        - 0x2c9C959516e9AAEdB2C748224a41249202ca8BE7
    - name: AmbientCore
      address:
        - 0x88B96aF200c8a9c35442C8AC6cd3D22695AaE4F0
    - name: Curvance
      address:
        - 0x8462c247356d7deB7e26160dbFab16B351Eef242
    # ERC20 explicit addresses (ALL tracked tokens - aggregation only, no individual transfers stored)
    - name: ERC20
      address:
        - 0x760AfE86e5de5fa0Ee542fc7B7B713e1c5425701  # WMON (wrapped native)
        - 0xf817257fed379853cDe0fa4F97AB987181B1E5Ea  # USDC (stablecoin)
        - 0x268e4e24e0051ec27b3d27a95977e71ce6875a05  # BEAN
        - 0xe0590015a873bf326bd645c3e1266d4db41c4e6b  # CHOG
        - 0x0f0bdebf0f83cd1ee3974779bcb7315f9808c714  # DAK
        - 0xfe140e1dCe99Be9F4F15d657CD9b7BF622270C50  # YAKI
        - 0xcf5a6076cfa32686c0Df13aBaDa2b40dec133F1d  # WBTC
        - 0x0569049E527BB151605EEC7bf48Cfd55bD2Bf4c8  # DAKIMAKURA
    # Universal Router contract for swap tracking
    - name: UniversalRouter
      address:
        - 0x3ae6d8a282d67893e17aa70ebffb33ee5aa65893
    # Kuru Orderbook (CLOB) - MON/USDC pair
    - name: KuruOrderbook
      address:
        - 0xD3AF145f1Aa1A471b5f0F62c52Cf8fcdc9AB55D3  # MON/USDC orderbook
unordered_multichain_mode: true
preload_handlers: true