type StakeManager_Deposit {
  id: ID!
  depositor: String!
  amount: BigInt!
  gMonMinted: BigInt!
  referralId: BigInt!
}

type StakeManager_Initialized {
  id: ID!
  version: BigInt!
}

type StakeManager_Withdraw {
  id: ID!
  withdrawer: String!
  amount: BigInt!
  gMonBurned: BigInt!
}

# Aggregation entities used by the backend adapter

type DailyMetrics {
  id: ID!
  protocolId: String!
  dateISO: String!
  usersDaily: Int!
  txDaily: Int!
  txCumulative: BigInt!
  avgTxPerUser: Float!
  avgFeeNative: Float
  # Aggregated fee accounting (sum of fees in wei and number of fee-counted txs)
  sumFeeWei: BigInt
  feeTxCount: Int
}

type DailyUser {
  id: ID!
  protocolId: String!
  dateISO: String!
  user: String!
}

type ProtocolState {
  id: ID!
  protocolId: String!
  txCumulative: BigInt!
}

# Per-tx fee dedup record to avoid double counting when multiple events occur in one tx
type FeeDedup {
  id: ID!
  protocolId: String!
  txHash: String!
  processedAt: BigInt!
}

# NEW: ERC20 Transfer tracking for AI features
type TokenTransfer {
  id: ID!
  tokenAddress: String! @index
  from: String! @index
  to: String! @index
  value: BigInt!
  blockNumber: Int! @index
  blockTimestamp: Int! @index
  transactionHash: String! @index
  logIndex: Int!
  gasUsed: BigInt!
  gasPrice: BigInt!
}

# NEW: Token metrics for AI momentum/volatility calculation
type TokenMetrics {
  id: ID!
  tokenAddress: String! @index
  tokenSymbol: String!
  totalVolume: BigInt!
  transferCount: Int!
  lastTransferTime: Int!
  hourlyVolume: BigInt!
  dailyVolume: BigInt!
  volatilityScore: Float!
  momentumScore: Float!
}

# NEW: Swap events for price/volume tracking
type SwapEvent {
  id: ID!
  pairKey: String! @index
  tokenIn: String! @index
  tokenOut: String! @index
  amountIn: BigInt!
  amountOut: BigInt!
  price: Float!
  recipient: String! @index
  blockNumber: Int! @index
  blockTimestamp: Int! @index
  transactionHash: String! @index
  logIndex: Int!
}

# NEW: Trading pair metrics for AI features
type PairMetrics {
  id: ID!
  pairKey: String! @index
  currentPrice: Float!
  previousPrice: Float!
  priceChange24h: Float!
  volatility24h: Float!
  volume24h: BigInt!
  swapCount24h: Int!
  lastUpdateTime: Int!
  priceHistory: [Float!]!
  momentumShort: Float! # 15min momentum for AI
  momentumLong: Float!  # 1h momentum for AI
}
type DailyTxFeeCounted {
  id: ID!
  protocolId: String!
  dateISO: String!
  txHash: String!
  feeWei: BigInt!
}

