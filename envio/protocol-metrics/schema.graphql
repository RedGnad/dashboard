type StakeManager_Deposit {
  id: ID!
  depositor: String!
  amount: BigInt!
  gMonMinted: BigInt!
  referralId: BigInt!
}

type StakeManager_Initialized {
  id: ID!
  version: BigInt!
}

type StakeManager_Withdraw {
  id: ID!
  withdrawer: String!
  amount: BigInt!
  gMonBurned: BigInt!
}

# Aggregation entities used by the backend adapter

type DailyMetrics {
  id: ID!
  protocolId: String!
  dateISO: String!
  usersDaily: Int!
  txDaily: Int!
  txCumulative: BigInt!
  avgTxPerUser: Float!
  avgFeeNative: Float
  # Aggregated fee accounting (sum of fees in wei and number of fee-counted txs)
  sumFeeWei: BigInt
  feeTxCount: Int
}

type DailyUser {
  id: ID!
  protocolId: String!
  dateISO: String!
  user: String!
}

type ProtocolState {
  id: ID!
  protocolId: String!
  txCumulative: BigInt!
}

# NEW: Token metrics for AI momentum/volatility calculation (AGGREGATION ONLY)
type TokenMetrics {
  id: ID!
  tokenAddress: String! @index
  tokenSymbol: String!
  totalVolume: BigInt!
  transferCount: Int!
  lastTransferTime: Int!
  hourlyVolume: BigInt!
  dailyVolume: BigInt!
  volatilityScore: Float!
  momentumScore: Float!
}

# NEW: Trading pair metrics for AI features (AGGREGATION ONLY)
type PairMetrics {
  id: ID!
  pairKey: String! @index
  currentPrice: Float!
  previousPrice: Float!
  priceChange24h: Float!
  volatility24h: Float!
  volume24h: BigInt!
  swapCount24h: Int!
  lastUpdateTime: Int!
  priceHistory: [Float!]!
  momentumShort: Float! # 15min momentum for AI
  momentumLong: Float!  # 1h momentum for AI
}
