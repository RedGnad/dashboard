# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: protocol-metrics
contracts:
  - name: StakeManager
    abi_file_path: abis/0x2c9c959516e9aaedb2c748224a41249202ca8be7.abi.json
    handler: src/EventHandlers.ts
    events:
      - event: Initialized
      - event: Deposit
        field_selection:
          transaction_fields:
            - hash
            - from
      - event: Withdraw
        field_selection:
          transaction_fields:
            - hash
            - from
  - name: AmbientCore
    abi_file_path: abis/ambient-core.json
    handler: src/EventHandlers_Ambient.ts
    events:
      - event: CrocSwap
        field_selection:
          transaction_fields:
            - hash
            - from
            - gasUsed
            - effectiveGasPrice
            - gasPrice
      - event: CrocMicroSwap
        field_selection:
          transaction_fields:
            - hash
            - from
            - gasUsed
            - effectiveGasPrice
            - gasPrice
  - name: Curvance
    abi_file_path: abis/vecve.json
    handler: src/EventHandlers_Curvance.ts
    events:
      - event: Locked
        field_selection:
          transaction_fields:
            - hash
            - from
            - gasUsed
            - effectiveGasPrice
            - gasPrice
      - event: Unlocked
        field_selection:
          transaction_fields:
            - hash
            - from
            - gasUsed
            - effectiveGasPrice
            - gasPrice
      - event: UnlockedWithPenalty
        field_selection:
          transaction_fields:
            - hash
            - from
            - gasUsed
            - effectiveGasPrice
            - gasPrice
      - event: Approval(address indexed owner, address indexed spender, uint256 amount)
        field_selection:
          transaction_fields:
            - hash
            - from
            - gasUsed
            - effectiveGasPrice
            - gasPrice
      - event: Transfer(address indexed from, address indexed to, uint256 amount)
        field_selection:
          transaction_fields:
            - hash
            - from
            - gasUsed
            - effectiveGasPrice
            - gasPrice
  # Wildcard indexing for all ERC20 transfers (for momentum/volatility calculation)
  - name: ERC20
    handler: src/EventHandlers_ERC20.ts
    events:
      - event: Transfer(address indexed from, address indexed to, uint256 value)
        field_selection:
          transaction_fields:
            - hash
            - from
            - to
            - value  # Include transaction value for native MON tracking
  # Universal Router swaps for DEX metrics
  - name: UniversalRouter
    abi_file_path: abis/universal-router.json
    handler: src/EventHandlers_Swaps.ts
    events:
      - event: SwapExecuted(address indexed tokenIn, address indexed tokenOut, uint256 amountIn, uint256 amountOut, address indexed recipient)
        field_selection:
          transaction_fields:
            - hash
            - from
            - value  # Include native value for MON/WMON correlation
  - name: KuruRouter
    abi_file_path: abis/KuruRouter.json
    handler: src/EventHandlers_Kuru.ts
    events:
      - event: MarketRegistered(address baseAsset, address quoteAsset, address market, address vaultAddress, uint32 pricePrecision, uint96 sizePrecision, uint32 tickSize, uint96 minSize, uint96 maxSize, uint256 takerFeeBps, uint256 makerFeeBps)
        field_selection:
          transaction_fields:
            - hash
  - name: KuruOrderBook
    abi_file_path: abis/KuruOrderBook.json
    handler: src/EventHandlers_Kuru.ts
    events:
      - event: Trade(uint40 orderId, address makerAddress, bool isBuy, uint256 price, uint96 updatedSize, address takerAddress, address txOrigin, uint96 filledSize)
        field_selection:
          transaction_fields:
            - hash
            - from
            - gasUsed
            - effectiveGasPrice
            - gasPrice
  - name: MonadDeployer
    abi_file_path: abis/MonadDeployer.json
    handler: src/EventHandlers_Kuru.ts
    events:
      - event: PumpingTime(address indexed token, string tokenURI, address dev, uint256 supplyToDev, address market)
  - name: PinguOrders
    abi_file_path: abis/PinguOrders.json
    handler: src/EventHandlers_Pingu.ts
    events:
      - event: OrderCreated(uint256 indexed orderId, address indexed user, address indexed asset, string market, uint256 margin, uint256 size, uint256 price, uint256 fee, bool isLong, uint8 orderType, bool isReduceOnly, uint256 expiry, uint256 cancelOrderId)
        field_selection:
          transaction_fields:
            - hash
            - from
      - event: OrderCancelled(uint256 indexed orderId, address indexed user, string reason)
        field_selection:
          transaction_fields:
            - hash
            - from
  - name: PinguProcessor
    abi_file_path: abis/PinguProcessor.json
    handler: src/EventHandlers_Pingu.ts
    events:
      - event: PositionLiquidated(address indexed user, address indexed asset, string market, bool isLong, uint256 size, uint256 margin, int256 pnl, uint256 price, uint256 fee)
        field_selection:
          transaction_fields:
            - hash
            - from
      - event: PositionADL(address indexed user, address indexed asset, string market, bool isLong, uint256 size, uint256 margin, int256 pnl, uint256 price, uint256 fee)
        field_selection:
          transaction_fields:
            - hash
            - from
  - name: PinguStaking
    abi_file_path: abis/PinguStaking.json
    handler: src/EventHandlers_Pingu.ts
    events:
      - event: CAPStaked(address indexed user, uint256 amount)
        field_selection:
          transaction_fields:
            - hash
            - from
      - event: CAPUnstaked(address indexed user, uint256 amount)
        field_selection:
          transaction_fields:
            - hash
            - from
      - event: CollectedReward(address indexed user, address indexed asset, uint256 amount)
        field_selection:
          transaction_fields:
            - hash
            - from
  # --- UniswapV2-style DEX support (Octoswap/Atlantis) ---
  # Provide Factory and Pair ABIs in abis/ and wire handlers in src/EventHandlers_UniswapV2.ts
  # 1) Factory: PairCreated(address token0, address token1, address pair, uint)
  # 2) Pair: Swap(address indexed sender, uint amount0In, uint amount1In, uint amount0Out, uint amount1Out, address indexed to)
  #
  # Example entries:
  - name: OctoswapFactory
    abi_file_path: abis/OctoFactory.json
    handler: src/EventHandlers_UniswapV2.ts
    events:
      - event: PairCreated(address indexed token0, address indexed token1, address pair, uint)
        field_selection:
          transaction_fields:
            - hash
            - from
  - name: OctoswapPair
    abi_file_path: abis/OctoPair.json
    handler: src/EventHandlers_UniswapV2.ts
    events:
      - event: Swap(address indexed sender, uint amount0In, uint amount1In, uint amount0Out, uint amount1Out, address indexed to)
        field_selection:
          transaction_fields:
            - hash
            - from
  - name: UniswapV2Factory
    abi_file_path: abis/UniswapV2Factory.json
    handler: src/EventHandlers_UniswapV2.ts
    events:
      - event: PairCreated(address indexed token0, address indexed token1, address pair, uint)
        field_selection:
          transaction_fields:
            - hash
            - from
  - name: UniswapV2Pair
    abi_file_path: abis/UniswapV2Pair.json
    handler: src/EventHandlers_UniswapV2.ts
    events:
      - event: Swap(address indexed sender, uint amount0In, uint amount1In, uint amount0Out, uint amount1Out, address indexed to)
        field_selection:
          transaction_fields:
            - hash
            - from
